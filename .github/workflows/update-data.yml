name: Update schedule data

on:
  schedule:
    # 06:15 UTC daily = just after West Coast games end
    - cron: "15 6 * 10,11,12,1,2,3,4 *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season id (e.g. 20262027). Blank = config default."
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Update season data
        env:
          # Repo secret (Settings -> Secrets -> Actions -> TEAM_CODE).
          TEAM_CODE: ${{ secrets.TEAM_CODE }}
          # Once the Fly API is set up, add these two secrets and this step
          # writes straight to Postgres -- no git commit for data anymore.
          # Leave them unset and this falls back to the old file-based
          # behavior below, so nothing breaks mid-migration.
          SCHEDULE_API_URL: ${{ secrets.SCHEDULE_API_URL }}
          SCHEDULE_API_ADMIN_KEY: ${{ secrets.SCHEDULE_API_ADMIN_KEY }}
        run: python scripts/update_data.py ${{ github.event.inputs.season }}
      - name: Commit if changed
        # Only relevant in the file-based fallback path -- if SCHEDULE_API_URL
        # is set, update_data.py already posted to the API and returned
        # before touching any files, so this diff will just be empty.
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          git diff --cached --quiet || git push
