name: Update league-wide data

on:
  schedule:
    # 07:00 UTC daily -- runs after the team-schedule update (06:15 UTC) so
    # this always reflects that day's results too. 32 team-schedule fetches
    # takes longer than the single-team update, hence the later start.
    - cron: "0 7 * 10,11,12,1,2,3,4 *"
  workflow_dispatch:
    inputs:
      season:
        description: "Season id (e.g. 20262027). Blank = config default."
        required: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update league-wide data
        run: python scripts/update_league.py ${{ github.event.inputs.season }}
      - name: Commit if changed
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@github.com"
          git add docs/data/league
          git diff --cached --quiet || git commit -m "League data update $(date -u +%F)"
          git push
